<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Usage Dashboard</title>
<style>
:root{--bg:#1c1b19;--card:#2a2926;--line:#ffffff17;--tx:#f5f1ea;--mut:#a39d93;--opus:#e8743b;--fable:#c76b8f;--sonnet:#f2b872;--haiku:#9db8a0;--other:#64748b;--g:linear-gradient(120deg,#ff9a5c,#e8743b)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,Segoe UI,system-ui,sans-serif;overflow-x:hidden}
/* animated aurora + grid */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;opacity:.35}
.bg i:nth-child(1){width:700px;height:700px;background:radial-gradient(circle,#b8481c 0,transparent 68%);left:-200px;top:-220px}
.bg i:nth-child(2){width:600px;height:600px;background:radial-gradient(circle,#8a5a2b 0,transparent 68%);right:-160px;top:5%;opacity:.28}
.bg i:nth-child(3){display:none}
.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px;}

.wrap{max-width:1320px;margin:0 auto;padding:26px 20px 70px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px;animation:rise .7s both}
.logo{width:46px;height:46px;border-radius:14px;background:#262522;border:1px solid #ffffff17;display:grid;place-items:center;position:relative}
.logo:before{content:"";position:absolute;inset:-5px;border-radius:18px;border:2px solid #e8743b;opacity:0;display:none}
.logo svg{width:30px;height:30px}
@keyframes ping{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.3px}
h1 span{background:var(--g);-webkit-background-clip:text;color:transparent}
h1 small{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);font-weight:400;letter-spacing:0}
.live{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 #4ade80aa;animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px #4ade8000}100%{box-shadow:0 0 0 0 #4ade8000}}
.sp{flex:1}
.seg{position:relative;display:flex;background:#262522;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{position:relative;z-index:1;background:none;border:0;color:var(--mut);padding:7px 16px;cursor:pointer;font:600 13px inherit;transition:color .25s}
.seg button.on{color:#1a1816}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:9px;background:var(--g);transition:left .35s cubic-bezier(.3,1.4,.5,1),width .35s}
.opt{position:relative;overflow:hidden;background:linear-gradient(120deg,#ff9a5c,#e8743b);color:#1a1816;border:0;border-radius:12px;padding:11px 20px;font:800 14px inherit;cursor:pointer;box-shadow:0 4px 18px #e8743b55;transition:transform .2s}
.opt:hover{transform:translateY(-2px) scale(1.04)}
.opt:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);display:none}
@keyframes sheen{60%,100%{left:130%}}@keyframes shift{to{background-position:200% 0}}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative;overflow:hidden;animation:rise .7s both;transition:border-color .25s}
.card:hover{border-color:#e8743b88}

@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.card h3{margin:0 0 14px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;justify-content:space-between}
.kpi{display:flex;flex-direction:column}
.kpi .v{font-size:36px;font-weight:800;letter-spacing:-1px;background:var(--g);-webkit-background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mut);font-size:12px;margin-top:2px}
.kpi svg.sp{width:100%;height:44px;margin-top:10px}
.cols{grid-template-columns:2fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.cols2{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.cols,.cols3,.cols2{grid-template-columns:1fr}}
svg text{fill:var(--mut);font-size:11px;font-family:inherit}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;display:block;height:auto;overflow:visible}
.reveal{animation:wipe 1.4s cubic-bezier(.6,0,.2,1) both}
@keyframes wipe{from{clip-path:inset(-10px 100% -10px 0)}to{clip-path:inset(-10px -10px -10px 0)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.8s cubic-bezier(.5,0,.2,1) .2s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.bar{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.hbar{transform-origin:left;animation:growx 1s cubic-bezier(.2,1,.3,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.donutwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.donut{width:190px;height:190px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:22;transition:stroke-dasharray 1.3s cubic-bezier(.3,1,.3,1) var(--d,0s)}
.dl{font-size:12.5px}.dl div{display:flex;align-items:center;gap:8px;margin:7px 0}.dl b{width:10px;height:10px;border-radius:3px}.dl span{margin-left:auto;padding-left:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:3px;align-items:center}
.heat .c{aspect-ratio:1;border-radius:4px;animation:pop .5s both;background:#e8743b}
.heat .l{font-size:10.5px;color:var(--mut)}
@keyframes pop{from{transform:scale(0);opacity:0}}
.row{display:grid;grid-template-columns:130px 1fr 150px;gap:10px;align-items:center;margin:10px 0}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tr{height:10px;border-radius:6px;background:#ffffff0d;overflow:hidden}.row .tr i{display:block;height:100%;border-radius:6px;background:var(--g)}
.row .val{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}th{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:1px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #ffffff0a;font-variant-numeric:tabular-nums}td.r,th.r{text-align:right}
tr.a{animation:slide .6s both}@keyframes slide{from{opacity:0;transform:translateX(-20px)}}
.tip{position:fixed;pointer-events:none;background:#1a1816ee;border:1px solid #e8743b88;border-radius:10px;padding:9px 12px;font-size:12px;z-index:60;display:none;white-space:pre;box-shadow:0 8px 30px #000a}
.modal{position:fixed;inset:0;background:#12110fcc;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50;overflow:auto;padding:30px 16px}
.modal.on{opacity:1;pointer-events:auto}
.panel{max-width:980px;margin:0 auto;background:#242321;border:1px solid #e8743b66;border-radius:22px;padding:26px;box-shadow:0 0 80px #e8743b33;transform:translateY(40px) scale(.96);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
.modal.on .panel{transform:none}
.panel h2{margin:0;font-size:24px;background:var(--g);-webkit-background-clip:text;color:transparent}
.x{float:right;background:#ffffff0d;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer}
.big{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.rec{border:1px solid var(--line);border-left:3px solid var(--sonnet);border-radius:12px;padding:12px 15px;margin:10px 0;background:#ffffff06;animation:slide .6s both}
.rec b{color:#ffc9a3}
.chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:11px;font-weight:800;color:#1a1816}
.note{color:var(--mut);font-size:12px;margin-top:16px}
.empty{padding:80px;text-align:center;color:var(--mut)}
.sub{color:var(--mut);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;margin:22px 0 8px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.gear{background:#262522;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font:600 13px inherit;cursor:pointer}.gear:hover{border-color:#e8743b88}
.lims{grid-template-columns:1fr 1fr;margin-bottom:16px}@media(max-width:900px){.lims{grid-template-columns:1fr}}
.lim{display:flex;gap:20px;align-items:center}.lim svg{width:128px;height:128px;transform:rotate(-90deg);flex:none}
.lim circle{fill:none;stroke-width:13;stroke-linecap:round}.lim .ring{transition:stroke-dasharray 1.4s cubic-bezier(.3,1,.3,1),stroke .4s}
.lim .pc{position:absolute;left:0;top:50%;transform:translateY(-50%);width:128px;text-align:center;font-size:24px;font-weight:800}
.lim .m{flex:1;min-width:0}.lim .amt{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.lim .amt small{font-size:14px;color:var(--mut);font-weight:500}
.lim .rs{margin-top:8px;color:var(--mut);font-size:12.5px;line-height:1.7}.lim .rs b{color:var(--tx);font-variant-numeric:tabular-nums}
.set label{display:block;margin:14px 0 4px;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.set input,.set select{width:100%;background:#1c1b19;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit}
.set .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.save2{margin-top:20px;background:var(--g);border:0;color:#1a1816;border-radius:10px;padding:11px 22px;font:800 14px inherit;cursor:pointer}
.cur button{border-radius:9px}.cur button.on{background:var(--g);color:#1a1816}
#pal{position:fixed;top:-27px;left:0;width:80px;height:104px;z-index:5;pointer-events:none;transform:translate(var(--x,200px),-130px);transition:transform .8s cubic-bezier(.3,1.5,.5,1);will-change:transform}
#pal.in{transform:translate(var(--x,200px),0)}#pal.slide{transition:transform 1.4s cubic-bezier(.45,.05,.3,1)}
#pal svg{width:80px;height:104px;overflow:visible}#pal .hit{pointer-events:auto;cursor:pointer}
#pal .sway{transform-origin:50px 34px;animation:sway 2.6s ease-in-out infinite alternate}
#pal.in.moving .sway{animation:sway .5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
#pal .legL,#pal .legR{transform-origin:50% 0;animation:kick 1.3s ease-in-out infinite alternate}#pal .legR{animation-delay:-.65s}
@keyframes kick{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#pal .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
#pal.blink .eye{animation:none;transform:scaleY(.1)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#pal.hop .sway{animation:hop .6s ease-out}
@keyframes hop{30%{transform:translateY(-14px) rotate(8deg)}60%{transform:translateY(0) rotate(-6deg)}100%{transform:none}}
#say{position:absolute;left:62px;top:36px;background:#f5f1ea;color:#1a1816;font:700 12px/1 Inter,system-ui,sans-serif;padding:6px 9px;border-radius:10px 10px 10px 2px;opacity:0;transform:translateY(6px) scale(.8);transition:.25s;white-space:nowrap}
#say.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){#pal{display:none}}
.wrap{padding-top:74px!important}
.act{margin-bottom:16px}.actTop{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px}
.actTop div{font-size:12px;color:var(--mut)}.actTop b{display:block;font-size:26px;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1.1}.actTop b i{font-style:normal;color:#e8743b}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.cal span{width:15px;height:15px;border-radius:4px;background:#ffffff0d;animation:pop .45s both}.cal span.t{outline:1.5px solid #f5f1ea}
.calLeg{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;color:var(--mut)}.calLeg span{width:12px;height:12px;border-radius:3px}
.onb{max-width:820px;margin:20px auto}.onb h2{margin:0 0 6px;font-size:26px}.onb h2 span{background:var(--g);-webkit-background-clip:text;color:transparent}
.onb p{color:var(--mut);margin:6px 0 18px}.step{display:flex;gap:14px;margin:16px 0}.step i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g);color:#1a1816;font:800 14px/28px inherit;text-align:center;font-style:normal}
.step div{flex:1;min-width:0}.step div>b:first-child{display:block;margin-bottom:4px}
.path{display:flex;align-items:center;gap:8px;background:#1c1b19;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font:12.5px ui-monospace,Consolas,monospace;color:#f2b872;overflow:auto}
.path em{font:600 11px Inter,system-ui,sans-serif;font-style:normal;color:var(--mut);flex:none;width:62px}.path code{flex:1;white-space:nowrap}.path button{flex:none;background:#ffffff12;border:0;color:var(--tx);border-radius:7px;padding:4px 9px;cursor:pointer;font:600 11px inherit}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.btn2{background:#262522;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 20px;font:700 14px inherit;cursor:pointer}.btn2:hover{border-color:#e8743b88}
.btn1{background:var(--g);color:#1a1816;border:0;border-radius:12px;padding:12px 22px;font:800 14px inherit;cursor:pointer;box-shadow:0 4px 18px #e8743b55}
.fine{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.7}.fine code{background:#1c1b19;padding:1px 6px;border-radius:5px;color:#f2b872}
.prog{height:8px;border-radius:6px;background:#ffffff0d;overflow:hidden;margin:16px 0}.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.credit{max-width:760px;margin:36px auto 0;text-align:center;color:var(--mut);font-size:11px;line-height:1.7;opacity:.75;padding-top:14px;border-top:1px solid var(--line)}.credit span{display:block}.credit a{color:#f2b872;text-decoration:none}.credit a:hover{text-decoration:underline}
</style></head><body>

 <g class="legL"><rect x="17" y="102" width="9" height="16" fill="#d97757"/><rect x="32" y="102" width="9" height="16" fill="#d97757"/></g>

<script>
// Estimated list prices, USD per million tokens (converted to INR at USD_INR). Edit to match your pricing.
const PRICES={haiku:{i:1,o:5},sonnet:{i:3,o:15},opus:{i:5,o:25},fable:{i:15,o:75}};
const COL={opus:'#e8743b',fable:'#c76b8f',sonnet:'#f2b872',haiku:'#9db8a0',other:'#64748b'};
const tier=m=>/fable/.test(m)?'fable':/opus/.test(m)?'opus':/sonnet/.test(m)?'sonnet':/haiku/.test(m)?'haiku':'other';
const USD_INR=88; // exchange rate: edit to today's rate
const pr=t=>PRICES[t]||PRICES.sonnet;
const cost=(r,t)=>{const p=pr(t||tier(r.model));return(r.i*p.i+r.o*p.o+r.cr*p.i*.1+r.cw*p.i*1.25)/1e6};
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n));
let CUR='INR';try{CUR=localStorage.getItem('cur')||'INR'}catch(e){}
const mult=()=>CUR==='INR'?USD_INR:1,sym=()=>CUR==='INR'?'₹':'$';
const usd=n=>{const v=n*mult();return sym()+(v>=100?Math.round(v).toLocaleString(CUR==='INR'?'en-IN':'en-US'):v.toFixed(2))};
const tot=r=>r.i+r.o+r.cr+r.cw;
let DATA=null,DAYS=30,lastN=-1;
const $=s=>document.querySelector(s),tip=$('#tip');
const stagger=(sel,ms=70)=>document.querySelectorAll(sel).forEach((e,i)=>e.style.animationDelay=i*ms+'ms');
function hover(el,txt){el.onmousemove=e=>{tip.style.display='block';tip.textContent=typeof txt==='function'?txt(e):txt;tip.style.left=Math.min(e.clientX+16,innerWidth-240)+'px';tip.style.top=e.clientY+16+'px'};el.onmouseleave=()=>tip.style.display='none'}
function countUp(el,to,f,dur=1400){const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=f(to*e);if(p<1)requestAnimationFrame(s)})(t0)}
function recs(){const from=DAYS?Date.now()-DAYS*864e5:0;return DATA.records.filter(r=>r.t>=from)}
function group(rs,f){const m=new Map();for(const r of rs){const k=f(r);let g=m.get(k);if(!g)m.set(k,g={k,n:0,tok:0,out:0,c:0,sess:new Set(),models:{}});g.n++;g.tok+=tot(r);g.out+=r.o;const c=cost(r);g.c+=c;g.sess.add(r.s);const t=tier(r.model);g.models[t]=(g.models[t]||0)+c}return[...m.values()]}
// smooth path through points
function smooth(p){if(p.length<2)return'';let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;const lo=Math.min(b[1],c[1]),hi=Math.max(b[1],c[1]),cl=v=>Math.max(lo,Math.min(hi,v));d+=`C${b[0]+(c[0]-a[0])/6},${cl(b[1]+(c[1]-a[1])/6)} ${c[0]-(e[0]-b[0])/6},${cl(c[1]-(e[1]-b[1])/6)} ${c[0]},${c[1]}`}return d}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1))),n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}

function buckets(rs){
  const hourly=DAYS===1,fn=r=>{const d=new Date(r.t);if(hourly)d.setMinutes(0,0,0);else d.setHours(0,0,0,0);return+d};
  const step=hourly?36e5:864e5,m=new Map();
  for(const r of rs){const k=fn(r),o=m.get(k)||{tok:0,c:0,n:0,o:0,t:{}};const t=tier(r.model);o.n++;o.o+=r.o;o.tok+=tot(r);o.c+=cost(r);o.t[t]=(o.t[t]||0)+tot(r);m.set(k,o)}
  const ks=[...m.keys()].sort((a,b)=>a-b),out=[];
  for(let k=ks[0];k<=ks[ks.length-1];k+=step)out.push({k,...(m.get(k)||{tok:0,c:0,n:0,o:0,t:{}})});
  return{list:out,hourly};
}
const lab=(k,h)=>{const d=new Date(k);return h?d.getHours()+':00':d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};

function areaChart(B,tiers){
  const W=820,H=290,L=46,R=10,T=10,Bt=28,iw=W-L-R,ih=H-T-Bt,n=B.list.length;
  const mx=niceMax(Math.max(...B.list.map(b=>b.tok))),x=i=>L+(n>1?i/(n-1):.5)*iw,y=v=>T+ih-v/mx*ih;
  let acc=B.list.map(()=>0),paths='',defs='';
  tiers.forEach((t,ti)=>{const top=B.list.map((b,i)=>acc[i]+(b.t[t]||0)),bot=acc.slice();
    const up=smooth(top.map((v,i)=>[x(i),y(v)])),dn=smooth(bot.map((v,i)=>[x(i),y(v)]).reverse());
    defs+=`<linearGradient id="ga${ti}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${COL[t]}" stop-opacity=".85"/><stop offset="1" stop-color="${COL[t]}" stop-opacity=".25"/></linearGradient>`;
    paths+=`<path d="${up}L${x(n-1)},${y(bot[n-1])}${dn.replace(/^M[^C]*/,'')}Z" fill="url(#ga${ti})"/><path d="${up}" fill="none" stroke="${COL[t]}" stroke-width="2"/>`;acc=top});
  let grid='';for(let i=0;i<=4;i++){const v=mx/4*i;grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#ffffff10"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  let xl='';const every=Math.max(1,Math.ceil(n/8));B.list.forEach((b,i)=>{if(i%every===0)xl+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${lab(b.k,B.hourly)}</text>`});
  return`<svg class="chart" id="area" viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>${grid}${xl}<g class="reveal">${paths}</g><line id="cur" y1="${T}" y2="${T+ih}" stroke="#fff" stroke-opacity=".5" stroke-dasharray="3 3" style="display:none"/><rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`;
}
function costLine(B){

  const x=i=>L+(n>1?i/(n-1):.5)*iw,y=v=>T+ih-v/mx*ih,pts=cum.map((v,i)=>[x(i),y(v)]);
  let grid='';for(let i=0;i<=3;i++){const v=mx/3*i;grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#ffffff10"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${sym()}${fmt(v*mult())}</text>`}
  const d=smooth(pts);

function dailyBars(B){

function donut(items,total){

  const arcs=items.map((g,i)=>{const len=g.v/total*C,s=`<circle cx="95" cy="95" r="${R}" stroke="${g.col}" stroke-dasharray="0 ${C}" data-len="${Math.max(0,len-2)}" data-c="${C}" stroke-dashoffset="${-off}" style="--d:${i*.15}s" data-t="${g.n}: ${usd(g.v)} (${(g.v/total*100).toFixed(0)}%)"/>`;off+=len;return s}).join('');

}
function heatmap(rs){
  const g=Array.from({length:7},()=>Array(24).fill(0));rs.forEach(r=>{const d=new Date(r.t);g[(d.getDay()+6)%7][d.getHours()]+=tot(r)});
  const mx=Math.max(...g.flat())||1,days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let o='<div></div>';
  for(let h=0;h<24;h++)o+=`<div class="l" style="text-align:center">${h%3===0?h:''}</div>`;

}
function spark(vals,col){const W=200,H=44,mx=Math.max(...vals)||1,n=vals.length,pts=vals.map((v,i)=>[n>1?i/(n-1)*W:W/2,H-4-v/mx*(H-8)]);

// ---- Optimiser ----
function advise(r){const t=tier(r.model);if(t==='haiku'||t==='other')return null;
  const heavy=r.tools.some(x=>DATA.heavy.includes(x));
  if(!heavy&&r.o<600&&!r.th)return'haiku';
  if((t==='opus'||t==='fable')&&r.o<3500&&!r.tools.includes('Agent')&&!r.tools.includes('Task'))return'sonnet';return null}
function optimise(){
  const rs=recs();let cur=0,alt=0,moved=0;const flows={},projs={};
  for(const r of rs){const c=cost(r);cur+=c;const tg=advise(r);if(!tg){alt+=c;continue}const c2=cost(r,tg);if(c2>=c){alt+=c;continue}
    alt+=c2;moved++;const f=tier(r.model)+'→'+tg,F=flows[f]||(flows[f]={n:0,save:0,from:tier(r.model),to:tg});F.n++;F.save+=c-c2;
    const P=projs[r.p]||(projs[r.p]={n:0,save:0});P.n++;P.save+=c-c2}
  const save=cur-alt,pct=cur?save/cur*100:0,score=Math.round(100-pct);
  const big=rs.filter(r=>['opus','fable'].includes(tier(r.model))),bigC=big.reduce((a,r)=>a+cost(r),0);
  const cw=rs.reduce((a,r)=>a+r.cw,0),cr=rs.reduce((a,r)=>a+r.cr,0),th=rs.filter(r=>r.th&&tier(r.model)!=='haiku').length;
  const fl=Object.values(flows).sort((a,b)=>b.save-a.save),pj=Object.entries(projs).sort((a,b)=>b[1].save-a[1].save).slice(0,6),mxS=fl[0]?fl[0].save:1,mxP=pj[0]?pj[0][1].save:1;
  const tips=[];
  if(big.length)tips.push(`<b>${(bigC/cur*100).toFixed(0)}% of spend</b> (${usd(bigC)}) went to Opus/Fable-class models over ${big.length.toLocaleString()} requests. Make a mid-tier model your default and step up only for architecture or hard debugging.`);
  if(flows['opus→haiku']||flows['fable→haiku']||flows['sonnet→haiku'])tips.push('Many requests were just <b>short tool calls (read, search, run)</b>. Delegate exploration and file-reading to a Haiku subagent.');
  if(flows['opus→sonnet']||flows['fable→sonnet'])tips.push('Moderate edits and answers (under 3.5K output tokens) are well within <b>Sonnet</b>. Plan with the big model, implement with Sonnet.');
  if(cr>0&&cw/cr>.25)tips.push(`Cache writes are high (${fmt(cw)} vs ${fmt(cr)} read). Idle gaps expire the prompt cache; keep sessions focused.`);
  if(th>rs.length*.3)tips.push('Over 30% of requests used extended thinking. Lower the effort setting for routine work.');
  const R=52,C=2*Math.PI*R;
  $('#panel').innerHTML=`<button class="x" onclick="closeM()">✕ Close</button>
  <h2>⚡ Optimisation report</h2><div style="color:var(--mut)">${DAYS?'Last '+DAYS+' day(s)':'All time'} · ${rs.length.toLocaleString()} requests analysed</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:18px 0">
   <div class="card"><h3>Potential savings</h3><div class="big" style="color:#4ade80" id="o1">$0</div><div class="s" style="color:var(--mut)">${pct.toFixed(0)}% of ${usd(cur)}</div></div>
   <div class="card"><h3>Could downshift</h3><div class="big" style="color:#f2b872" id="o2">0</div><div class="s" style="color:var(--mut)">${(moved/Math.max(1,rs.length)*100).toFixed(0)}% of requests</div></div>
   <div class="card" style="display:flex;align-items:center;gap:16px"><svg width="110" height="110" viewBox="0 0 120 120" style="transform:rotate(-90deg)"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#ffffff10" stroke-width="12"/><circle id="sc" cx="60" cy="60" r="${R}" fill="none" stroke="url(#cg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 ${C}" style="transition:stroke-dasharray 1.6s cubic-bezier(.3,1,.3,1)" data-v="${C*score/100}" data-c="${C}"/></svg><div><h3 style="margin:0">Efficiency</h3><div class="big" id="o3">0</div></div></div></div>
  <div class="sub">What you could have used instead</div>
  ${fl.length?fl.map(f=>`<div class="row" style="grid-template-columns:190px 1fr 130px"><div><span class="chip" style="background:${COL[f.from]}">${f.from}</span> → <span class="chip" style="background:${COL[f.to]}">${f.to}</span></div><div class="tr"><i class="hbar" style="width:${f.save/mxS*100}%"></i></div><div class="val"><span style="color:#4ade80">${usd(f.save)}</span> · ${f.n.toLocaleString()} req</div></div>`).join(''):'<div class="rec">Nothing obvious to downshift. Your model choices look efficient.</div>'}
  ${pj.length?`<div class="sub">Biggest opportunities by project</div>`+pj.map(([k,p])=>`<div class="row" style="grid-template-columns:190px 1fr 130px"><div class="n">${k}</div><div class="tr"><i class="hbar" style="width:${p.save/mxP*100}%"></i></div><div class="val"><span style="color:#4ade80">${usd(p.save)}</span> · ${p.n.toLocaleString()} req</div></div>`).join(''):''}
  <div class="sub">Recommendations</div>${tips.map((t,i)=>`<div class="rec" style="animation-delay:${i*120+400}ms">${t}</div>`).join('')||'<div class="rec">No recommendations.</div>'}
  <div class="note">Each request is scored by output size, extended thinking and tools used. Short turns with only read/search/run tools → Haiku; moderate turns without sub-agents or heavy edits on Opus/Fable → Sonnet. Costs are estimates from list prices (editable at the top of the script) and ignore quality, so try the cheaper tier on routine work first.</div>`;
  $('#modal').classList.add('on');
  countUp($('#o1'),save,usd,1600);countUp($('#o2'),moved,v=>Math.round(v).toLocaleString());countUp($('#o3'),score,v=>Math.round(v)+'%');
  setTimeout(()=>{const s=$('#sc');s.setAttribute('stroke-dasharray',`${s.dataset.v} ${s.dataset.c}`)},200);
}

const LIM_DEF={daily:60,weekly:300,dHour:0,wDay:1,wHour:0};
let LIM=Object.assign({},LIM_DEF);try{Object.assign(LIM,JSON.parse(localStorage.getItem('limits2')||'{}'))}catch(e){}
function windows(){const now=new Date(),d=new Date(now);d.setHours(+LIM.dHour,0,0,0);if(d>now)d.setDate(d.getDate()-1);
  const w=new Date(now);w.setHours(+LIM.wHour,0,0,0);w.setDate(w.getDate()-((w.getDay()-LIM.wDay+7)%7));if(w>now)w.setDate(w.getDate()-7);
  return[{k:'Daily',s:+d,e:+d+864e5,lim:+LIM.daily},{k:'Weekly',s:+w,e:+w+6048e5,lim:+LIM.weekly}]}
const dur=ms=>{ms=Math.max(0,ms);const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return(d?d+'d ':'')+(d||h?h+'h ':'')+m+'m'+(d?'':' '+String(s).padStart(2,'0')+'s')};

const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function activityHTML(){
  const day=new Map();for(const r of DATA.records){const k=dkey(r.t),o=day.get(k)||{c:0,n:0};o.c+=cost(r);o.n++;day.set(k,o)}
  const today=new Date();today.setHours(0,0,0,0);const WEEKS=20,start=new Date(today);start.setDate(start.getDate()-((today.getDay()+6)%7)-(WEEKS-1)*7);
  const vals=[...day.values()].map(o=>o.c).sort((a,b)=>a-b),q=f=>vals[Math.floor((vals.length-1)*f)]||0,th=[q(.25),q(.5),q(.75)];
  const lvl=c=>!c?0:c<=th[0]?1:c<=th[1]?2:c<=th[2]?3:4,AL=['','55','88','bb','ff'];
  let cells='',i=0;for(let d=new Date(start);d<=today;d.setDate(d.getDate()+1),i++){
    const o=day.get(dkey(d)),l=lvl(o?o.c:0),isT=+d===+today;
    cells+=`<span class="${isT?'t':''}" data-t="${d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}\n${o?o.n+' requests · '+usd(o.c):'No activity'}" style="${l?'background:#d97757'+AL[l]+';':''}animation-delay:${i*5}ms"></span>`}
  const has=k=>day.has(k);let streak=0,cur=new Date(today);if(!has(dkey(cur)))cur.setDate(cur.getDate()-1);while(has(dkey(cur))){streak++;cur.setDate(cur.getDate()-1)}
  const ds=[...day.keys()].map(k=>{const[y,m,dd]=k.split('-');return+new Date(+y,+m,+dd)}).sort((a,b)=>a-b);let best=0,run=0;ds.forEach((t,j)=>{run=j&&Math.round((t-ds[j-1])/864e5)===1?run+1:1;best=Math.max(best,run)});
  const act=ds.length,span=Math.round((today-ds[0])/864e5)+1;
  return`<div class="card act"><h3>Active days <span>last ${WEEKS} weeks</span></h3><div class="actTop"><div><b>${streak}<i> 🔥</i></b>day streak</div><div><b>${best}</b>longest streak</div><div><b>${act}<small style="font-size:14px;color:var(--mut);font-weight:500"> / ${span}</small></b>days active</div></div>
  <div class="cal">${cells}</div><div class="calLeg">Less ${AL.map((a,j)=>`<span style="background:${j?'#d97757'+a:'#ffffff0d'}"></span>`).join('')} More · outlined = today</div></div>`}
function limitsHTML(){const now=Date.now();return'<div class="grid lims">'+windows().map(w=>{
  const used=DATA.records.reduce((a,r)=>r.t>=w.s&&r.t<=now?a+cost(r):a,0),pct=used/w.lim*100,el=Math.max(1,now-w.s),proj=used/el*(w.e-w.s);
  const col=pct>=100?'#ef4444':pct>=80?'#f59e0b':pct>=60?'#f2b872':'#e8743b',st=pct>=100?'Limit reached':proj>w.lim?'Pace exceeds limit':'On track',C=2*Math.PI*54;
  return`<div class="card lim"><div style="position:relative"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="54" stroke="#ffffff0f"/><circle class="ring" cx="64" cy="64" r="54" stroke="${col}" stroke-dasharray="0 999" data-v="${Math.min(1,pct/100)*C}"/></svg><div class="pc" style="color:${col}">${Math.round(pct)}%</div></div>
  <div class="m"><h3 style="margin-bottom:6px">${w.k} limit <span class="chip" style="background:${col}">${st}</span></h3><div class="amt">${usd(used)} <small>of ${usd(w.lim)}</small></div>
  <div class="rs">Resets in <b data-end="${w.e}">${dur(w.e-now)}</b><br>${rtime(w.e)}<br>Projected at this pace: ${usd(proj)}</div></div></div>`}).join('')+'</div>'}

  <div class="set"><div class="two"><div><label>Daily limit (${sym()})</label><input id="sd" type="number" min="1" value="${Math.round(LIM.daily*mult())}"></div><div><label>Weekly limit (${sym()})</label><input id="sw" type="number" min="1" value="${Math.round(LIM.weekly*mult())}"></div></div>

  $('#modal').classList.add('on')}

// ---- Mascot ----
(function(){
  const pal=$('#pal');if(!pal||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const pL=$('#pL'),pR=$('#pR'),say=$('#say'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let x=200,visible=false,busy=false;
  const setX=v=>{x=v;pal.style.setProperty('--x',v+'px')};
  const look=(dx,dy)=>{const t=`translate(${dx}px,${dy}px)`;pL.style.transform=t;pR.style.transform=t;pL.style.transition=pR.style.transition='transform .25s'};
  const talk=async(t,ms=1500)=>{say.textContent=t;say.classList.add('on');await sleep(ms);say.classList.remove('on')};
  const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
  const maxX=()=>Math.max(120,innerWidth-140);
  addEventListener('mousemove',e=>{if(!visible)return;const cx=x+40,cy=40,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/120);look(dx/d*3*k,dy/d*3*k)});
  $('#body').addEventListener('click',async()=>{if(!visible)return;pal.classList.add('hop');setTimeout(()=>pal.classList.remove('hop'),650);talk(pick(['hi! 👋','eep!','got any tokens?','watching your spend 👀','tee-hee']),1600)});
  async function loop(){
    for(;;){
      await sleep(rnd(2500,6000));
      pal.classList.remove('in');visible=false;await sleep(300);
      pal.classList.remove('slide');setX(rnd(20,maxX()));await sleep(60);
      pal.classList.add('in');visible=true;await sleep(900);
      const acts=Math.floor(rnd(2,5));
      for(let i=0;i<acts;i++){
        const a=Math.random();
        if(a<.4){look(-3,0);await sleep(700);look(3,0);await sleep(800);look(0,-1);await sleep(400)}
        else if(a<.7){pal.classList.add('slide','moving');setX(Math.max(10,Math.min(maxX(),x+rnd(-300,300))));await sleep(1500);pal.classList.remove('moving');await sleep(300)}
        else if(a<.85){pal.classList.add('blink');await sleep(180);pal.classList.remove('blink');await sleep(350);pal.classList.add('blink');await sleep(180);pal.classList.remove('blink')}
        else{pal.classList.add('hop');await talk(pick(['peek-a-boo!','hello 👋','nice usage!','psst… use Sonnet 😉']),1500);pal.classList.remove('hop')}
        await sleep(rnd(400,1200));
      }
      pal.classList.remove('slide');
    }
  }
  setX(innerWidth*.6);look(0,0);setTimeout(loop,1200);
})();

$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

// ---- Data loading: local server (live) or in-browser folder link (works on GitHub Pages) ----
const HEAVY=['Edit','Write','NotebookEdit','MultiEdit','Agent','Task'];
let MODE='server',dirHandle=null;
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('cud',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbGet=async k=>{try{const d=await idb();return await new Promise(r=>{const t=d.transaction('k').objectStore('k').get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(null)})}catch(e){return null}};
const idbSet=async(k,v)=>{try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,k)}catch(e){}};
const tick0=()=>new Promise(r=>setTimeout(r));
async function parseFileObj(file){
  const byId=new Map(),dec=new TextDecoder(),rd=file.stream().getReader();let buf='';
  const handle=line=>{if(!line.includes('"usage"'))return;let j;try{j=JSON.parse(line)}catch(e){return}
    const m=j.message;if(!m||!m.usage||!m.model||m.model.startsWith('<'))return;const u=m.usage,tools=[];let th=false;
    if(Array.isArray(m.content))for(const b of m.content){if(b.type==='tool_use')tools.push(b.name);if(b.type==='thinking')th=true}
    const key=(m.id||j.uuid)+'|'+(j.requestId||''),prev=byId.get(key);
    byId.set(key,{t:Date.parse(j.timestamp),model:m.model,i:u.input_tokens||0,o:u.output_tokens||0,cr:u.cache_read_input_tokens||0,cw:u.cache_creation_input_tokens||0,
      p:(j.cwd||'').replace(/\\/g,'/').split('/').filter(Boolean).pop()||'unknown',s:j.sessionId||file.name.replace('.jsonl',''),
      tools:prev?[...new Set([...prev.tools,...tools])]:tools,th:th||(prev&&prev.th)||false})};
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let n;while((n=buf.indexOf('\n'))>=0){handle(buf.slice(0,n));buf=buf.slice(n+1)}}
  if(buf)handle(buf);return[...byId.values()].filter(r=>r.t)}
async function collectFromDir(dir,out=[]){for await(const[name,h]of dir.entries()){if(h.kind==='directory')await collectFromDir(h,out);else if(name.endsWith('.jsonl'))out.push(await h.getFile())}return out}
async function ingest(files){
  files=files.filter(f=>f.name.endsWith('.jsonl'));
  if(!files.length){alert('No .jsonl files found. Choose the "projects" folder inside .claude.');return false}
  $('#app').innerHTML='<div class="card onb"><h2>Reading your Claude logs…</h2><p id="pt">0 / '+files.length+' files · everything stays in your browser</p><div class="prog"><i id="pb"></i></div></div>';
  const all=[];for(let k=0;k<files.length;k++){try{all.push(...await parseFileObj(files[k]))}catch(e){console.warn(files[k].name,e)}
    $('#pt').textContent=`${k+1} / ${files.length} files · everything stays in your browser`;$('#pb').style.width=(k+1)/files.length*100+'%';await tick0()}
  all.sort((a,b)=>a.t-b.t);DATA={files:files.length,heavy:HEAVY,records:all,demo:false};lastN=all.length;idbSet('data',DATA);render();return true}
async function linkFolder(){
  if(window.showDirectoryPicker){try{dirHandle=await showDirectoryPicker({id:'claude-projects',mode:'read'});idbSet('handle',dirHandle);await ingest(await collectFromDir(dirHandle))}catch(e){if(e.name!=='AbortError')alert('Could not read that folder: '+e.message)}}
  else $('#fpick').click()}
$('#fpick').onchange=e=>ingest([...e.target.files]);
async function refreshLinked(){const h=dirHandle||await idbGet('handle');if(!h)return linkFolder();
  try{if(await h.requestPermission({mode:'read'})!=='granted')return linkFolder();dirHandle=h;await ingest(await collectFromDir(h))}catch(e){linkFolder()}}
function demoData(){const models=[['claude-sonnet-5-5',.72],['claude-opus-5-5',.17],['claude-haiku-5-5',.11]],projs=['web-app','api','mobile','docs','scripts'],recs=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let d=34;d>=0;d--){if(rnd()<.18)continue;const n=Math.floor(25+rnd()*110);for(let k=0;k<n;k++){const t=Date.now()-d*864e5-rnd()*864e5*.8,x=rnd();let m=models[0][0],a=0;for(const[mm,w]of models){a+=w;if(x<a){m=mm;break}}
    const heavy=rnd()<.35;recs.push({t,model:m,i:Math.floor(rnd()*8),o:Math.floor(rnd()<.55?rnd()*500:rnd()*5000),cr:Math.floor(20000+rnd()*90000),cw:Math.floor(rnd()<.3?rnd()*30000:rnd()*3000),p:projs[Math.floor(rnd()*projs.length)],s:'demo-'+d+'-'+Math.floor(k/30),tools:heavy?['Edit']:rnd()<.6?['Read']:[],th:rnd()<.12})}}
  recs.sort((a,b)=>a.t-b.t);DATA={files:0,heavy:HEAVY,records:recs,demo:true};lastN=recs.length;render()}

  const cp=t=>`<button onclick="navigator.clipboard&&navigator.clipboard.writeText(this.dataset.t);this.textContent='Copied'" data-t="${t}">Copy</button>`;
  $('#src').textContent='not linked yet';
  $('#app').innerHTML=`<div class="card onb"><h2>Link your <span>Claude</span> usage</h2>
  <p>This dashboard reads the usage logs that <b>Claude Code</b> saves on your own computer. Your files are read <b>inside your browser</b> and are never uploaded anywhere.</p>
  <div class="step"><i>1</i><div><b>Find your Claude logs folder</b>Claude Code keeps every session as a <code>.jsonl</code> file in a hidden folder called <code>.claude/projects</code>:
   <div class="path"><em>Windows</em><code>%USERPROFILE%\\.claude\\projects</code>${cp('%USERPROFILE%\\\\.claude\\\\projects')}</div>
   <div class="path"><em>macOS</em><code>~/.claude/projects</code>${cp('~/.claude/projects')}</div>
   <div class="path"><em>Linux</em><code>~/.claude/projects</code>${cp('~/.claude/projects')}</div></div></div>
  <div class="step"><i>2</i><div><b>Choose that folder</b>Click <b>Choose folder</b> and pick <code>projects</code> (the whole folder, not a single project). The folder is hidden, so in the dialog paste the path above into the address bar (Windows), press <code>Cmd+Shift+G</code> (macOS) or <code>Ctrl+H</code> (Linux).</div></div>
  <div class="step"><i>3</i><div><b>That's it</b>Your usage, limits and savings tips appear. Next time, press <b>🔗 Link Claude</b> to refresh. Your data stays saved in this browser only.</div></div>
  <div class="btns"><button class="btn1" onclick="linkFolder()">📂 Choose folder</button><button class="btn2" onclick="demoData()">▶ Try demo data</button></div>
  <div class="fine">Works best in Chrome, Edge or Brave. Firefox and Safari use a one-time folder upload that stays on your machine.<br>This shows <b>Claude Code</b> usage only, not the claude.ai chat app. Costs are estimates at API prices.<br>Want live auto-updating instead? Clone the repo and run <code>node server.js</code>, then open <code>localhost:4317</code>.</div></div>`}
async function load(){
  try{const r=await fetch('/api/data',{cache:'no-store'});if(r.ok&&(r.headers.get('content-type')||'').includes('json')){const d=await r.json();MODE='server';DATA=d;if(d.records.length!==lastN){lastN=d.records.length;render()}return}}catch(e){}
  if(MODE==='server'&&DATA)return;
}
async function init(){
  let ok=false;try{const r=await fetch('/api/data',{cache:'no-store'});ok=r.ok&&(r.headers.get('content-type')||'').includes('json');if(ok){DATA=await r.json();lastN=DATA.records.length;MODE='server';render();setInterval(load,60000)}}catch(e){}
  if(ok)return;MODE='browser';$('#linkBtn').style.display='';
  const saved=await idbGet('data');if(saved&&saved.records&&saved.records.length){DATA=saved;lastN=saved.records.length;render()}else onboarding()}
$('#linkBtn').onclick=()=>MODE==='browser'&&(DATA&&!DATA.demo?refreshLinked():linkFolder());
movePill();init();
</script></body></html>
